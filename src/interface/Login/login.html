<!DOCTYPE html>


<html lang="en-US">
  
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>VisualIDE - Login</title>
  </head>
  
  <body>
     <!-- === Logo Icon === -->
     <img src="favicon.svg" id="appIcon" alt="VisualIDE Logo">
     <!-- === A Message of Welcome === -->
     <h1>Welcome to Login!</h1>
     <!-- === The Inputs === -->
     <input type="text" id="name" placeholder="Name">
     <input type="email" id="email" placeholder="Email">
     <input type="password" id="password" placeholder="Password">
     <input type="password" id="appPassword" placeholder="App Password">
     <input type="text" id="githubAccount" placeholder="GitHub Account">
     <input type="password" id="githubToken" placeholder="GitHub Token">
     <input type="submit" id="loginBtn" value="Login">
     <!-- === The Script JavaScript of Login System === -->
     <script type="module" src="login.js"></script>
  </body>
  
</html>
